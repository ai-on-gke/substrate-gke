# GKE's changes to agent-substrate/substrate's control plane manifests
# (manifests/ate-install). Each patch targets its object by name, so a stream
# without that object is left alone.
#
# Patches only: ate-setup's deploy --component (agent-substrate/substrate PR
# 3179) rejects components that add resources. The router PodMonitoring is
# in ../../resources for that reason.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # GKE taints the nodes it creates for a ComputeClass with
  # cloud.google.com/compute-class=<class>:NoSchedule and adds the matching
  # toleration to pods that select the class, so a WorkerPool whose
  # template.nodeSelector selects a ComputeClass runs its workers on those
  # nodes. atelet must run on those nodes too. Appended with a JSON patch,
  # because a strategic merge patch would replace atelet's own toleration list
  # (ate.dev/sandboxClass).
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: atelet
      namespace: ate-system
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations/-
        value:
          key: cloud.google.com/compute-class
          operator: Exists
          effect: NoSchedule
  # Send the control plane's OTLP traffic to GKE's managed OpenTelemetry
  # collector. Every control plane component reads ate-otel-config through
  # envFrom.
  - target:
      version: v1
      kind: ConfigMap
      name: ate-otel-config
      namespace: ate-system
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ate-otel-config
        namespace: ate-system
      data:
        OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
